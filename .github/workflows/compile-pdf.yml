name: Compile Typst and Release on Commit
on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: typst-community/setup-typst@v5
      - run: typst compile divelog.typ divelog.pdf

      - uses: actions/upload-artifact@v4
      - with:
          name: compiled-document
          path: divelog.pdf
